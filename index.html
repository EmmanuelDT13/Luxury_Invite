<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F7F2E9">
  <title>Invitación de boda</title>

  <!-- ✏️ Vista previa al compartir por WhatsApp / redes.
       Los rastreadores de WhatsApp no ejecutan JavaScript, por eso estas 4 líneas
       son lo único que se edita aquí (todo lo demás está en config.js). -->
  <meta name="description" content="Valentina & Alejandro · 18 de septiembre de 2027 · Guadalajara">
  <meta property="og:title" content="Valentina & Alejandro · Nos casamos">
  <meta property="og:description" content="Sábado 18 de septiembre de 2027 · Guadalajara, Jalisco">
  <meta property="og:image" content="https://images.unsplash.com/photo-1546032996-6dfacbacbf3f?auto=format&fit=crop&w=1200&h=630&q=80">
  <meta property="og:type" content="website">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="css/estilos.css">
  <script src="config.js"></script>
  <script src="js/arranque.js"></script>
</head>
<body class="bloqueado">

  <!-- Pantalla de carga -->
  <div id="precarga" class="precarga" aria-hidden="true">
    <svg class="precarga__aro" viewBox="0 0 120 120"><circle cx="60" cy="60" r="54" pathLength="1"/></svg>
    <span class="precarga__mono"></span>
  </div>

  <!-- Portada: sobre lacrado -->
  <section id="portada" class="portada" aria-label="Portada de la invitación"></section>

  <!-- Invitación (se construye desde config.js) -->
  <main id="invitacion" class="invitacion" aria-hidden="true"></main>

  <!-- Controles flotantes -->
  <div class="progreso" aria-hidden="true"><i></i></div>
  <button id="musica" class="musica" type="button" aria-label="Activar música" hidden></button>
  <div id="visor" class="visor" role="dialog" aria-modal="true" aria-label="Galería" hidden></div>
  <div id="aviso" class="aviso" role="status" aria-live="polite"></div>
  <canvas id="confeti" class="confeti" aria-hidden="true"></canvas>

  <script src="js/ornamentos.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
